<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tomato Cloud</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script><body>
<header><strong>Tomato Cloud</strong><span>项目与工作区协作</span><button id="logout" hidden>退出登录</button></header>
<main><section id="login"><h1>登录云端工作区</h1><p>连接设置与工作文件随账号同步；数据库密码保留在本地。</p><form id="login-form"><label>服务账号<input name="email" type="email" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" minlength="12" required></label><label>验证码／恢复码<input name="code" autocomplete="one-time-code"></label><button>登录</button><button type="button" id="register">注册账号</button><button type="button" id="recover">验证／找回账号</button></form></section>
<section id="workspace" hidden><nav><button data-page="projects">项目</button><button data-page="invitations">邀请</button><button data-page="account">账号与安全</button><button data-page="admin" id="admin-nav" hidden>用户管理</button><span id="identity"></span></nav><div id="content"></div></section><p id="notice" role="status"></p></main>
<dialog id="dialog"><form method="dialog"><h2 id="dialog-title"></h2><div id="dialog-content"></div><div class="actions"><button value="cancel">取消</button><button value="ok" id="dialog-ok">确定</button></div></form></dialog>
</body></html>
