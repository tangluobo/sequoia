[package]
name = "tomato-native-input"
version.workspace = true
edition.workspace = true
license.workspace = true
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[dependencies]
anyhow.workspace = true
tomato-core.workspace = true
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_Diagnostics_Debug"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21.0"
