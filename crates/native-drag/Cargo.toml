[package]
name = "tomato-native-drag"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
anyhow.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_UI_Shell_Common", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_Storage_FileSystem"] }
windows-core = "0.62.2"
tempfile = "3"

[dev-dependencies]
zip = { version = "3", default-features = false, features = ["deflate"] }
