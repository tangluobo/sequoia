[package]
name = "tomato-services"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
libadb = { version = "=0.9.0", features = ["host-keys", "pairing"] }
sha2 = "0.10"
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "flac"] }
zeroize = "1"
tomato-ed2k = { path = "../../vendor/risuko-ed2k" }
librqbit = { version = "=9.1.0", default-features = false, features = ["rust-tls"] }
parking_lot = "0.12"
oracledb = { path = "../../vendor/oracledb" }
tar = "0.4.46"
flate2 = {version="1",default-features=false,features=["rust_backend"]}
sha1 = "0.10"
tomato-core.workspace = true
tomato-native-input = { path = "../native-input" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "any", "mysql", "postgres", "sqlite"] }
sqlx-core = { version = "0.8", default-features = false, features = ["any"] }
futures-util = "0.3"
url = "2"
percent-encoding = "2"
redis = { version = "0.32", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-webpki-roots", "cluster-async"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "stream", "socks"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico"] }
png = "=0.18.1"
resvg = "0.45"
roxmltree = "=0.20.0"
quick-xml = { version = "0.38", features = ["serialize"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tempfile = "3"
open = "5"
portable-pty = "0.9"
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
ironrdp-client = { version = "0.1.0", default-features = false, features = ["rustls", "clipboard", "sound", "graphics-h264"] }
ironrdp-pdu = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
zmodem2 = "0.7.1"
russh-sftp = "3"
chrono = "0.4"
opendal = { version = "0.59.4", default-features = false, features = ["services-fs", "services-ftp", "services-s3", "services-oss", "executors-tokio", "http-transport-reqwest", "layers-concurrent-limit", "layers-timeout"] }
libunftp = { version = "0.23.1", default-features = false, features = ["ring"] }
unftp-sbe-fs = "0.4.0"
smb-server = { version = "=0.9.1", default-features = false, features = ["localfs"] }
reqsign-core = "3.3.2"
reqsign-aws-v4 = "3.3.1"
reqsign-aliyun-oss = "3.2.0"
http = "1"
async-trait = "0.1"
base64 = "0.22"
unftp-core = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
process-wrap = { version = "=10.0.1", default-features = false, features = ["std", "tokio1", "creation-flags", "job-object", "kill-on-drop", "process-group"] }
ring = "0.17"
mime_guess = "2"
suppaftp = { version = "10.0.2", default-features = false, features = ["tokio"] }
des = "0.9"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
mongodb = { version = "=3.9.1", default-features = false, features = ["compat-3-3-0", "rustls-tls", "dns-resolver", "bson-3"] }
bson = { version = "3.1", features = ["serde_json-1"] }
zip = { version = "3", default-features = false, features = ["deflate"] }
kafka-protocol = "0.17"
bytes = "1"
openh264 = "=0.9.8"
h264-reader = "=0.8.0"
bytemuck = "1"
http-body-util = "0.1"
lz4 = "1"
zstd = "0.13"
snap = "1"
instant-acme = { version = "0.8", default-features = false, features = ["hyper-rustls", "ring"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
x509-parser = "0.18"
pem = "3"
rsa = { version = "0.9", features = ["pem"] }
jks = { version = "0.3", default-features = false, features = ["rand"] }
p12-keystore = "0.3"
cross-krb5 = { version = "=0.5.0", default-features = false }
cfb = "0.14"
encoding_rs = "0.8"
csv = "=1.4.0"
calamine = { version = "0.31", features = ["dates"] }
dbase = { version = "0.7", features = ["encoding_rs", "yore"] }
yore = "1"
odbc-api = { version = "=29.2.0", default-features = false, features = ["odbc_version_3_80"] }

[dev-dependencies]
cpal = "=0.17.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ironrdp-dvc = "0.8"
ironrdp-graphics = "0.9"
ironrdp-egfx = "0.3"
ironrdp-svc = "0.8"
rand = "0.10"
async-trait = "0.1"
ironrdp-server = { version = "0.13", default-features = false, features = ["helper", "egfx"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
tempfile = "3"


[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }
tomato-native-drag = { path = "../native-drag" }
clipboard-win = { version = "5", features = ["std"] }

[target.'cfg(not(windows))'.dependencies]
clipboard-rs = { version = "=0.3.5", default-features = false, features = ["wayland"] }

