[package]
name = "tomato-ed2k"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Embedded eD2k/Kad download engine, adapted from Risuko"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "net", "macros", "io-util", "fs"] }
hex = "0.4"
parking_lot = "0.12"
thiserror = "2"
percent-encoding = "2"
tracing = "0.1"
futures-util = "0.3"
rand = "0.10"
tokio-util = { version = "0.7", features = ["io", "rt"] }
bytes = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
