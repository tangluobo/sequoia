
["package"]
"name" = "ironrdp-cliprdr"
"version" = "0.7.0"
"readme" = "README.md"
"description" = "CLIPRDR static channel for clipboard implemented as described in MS-RDPECLIP"
"edition" = "2024"
"rust-version" = "1.94"
"license" = "MIT OR Apache-2.0"
"homepage" = "https://github.com/Devolutions/IronRDP"
"repository" = "https://github.com/Devolutions/IronRDP"
"authors" = ["Devolutions Inc. <infos@devolutions.net>", "Teleport <goteleport.com>"]
"keywords" = ["rdp", "remote-desktop", "network", "client", "protocol"]
"categories" = ["network-programming"]

["lib"]
"doctest" = false
"test" = false

["features"]
"__test" = ["dep:visibility"]

["dependencies"]
"bitflags" = "2.11"

["dependencies"."ironrdp-core"]
"version" = "0.2"

["dependencies"."ironrdp-pdu"]
"version" = "0.9"

["dependencies"."ironrdp-svc"]
"version" = "0.8"

["dependencies"."tracing"]
"version" = "0.1"
"features" = ["log"]

["dependencies"."visibility"]
"version" = "0.1"
"optional" = true

["lints"]

["lints"."rust"]
"unsafe_op_in_unsafe_fn" = "warn"
"invalid_reference_casting" = "warn"
"unused_unsafe" = "warn"
"missing_unsafe_on_extern" = "warn"
"unsafe_attr_outside_unsafe" = "warn"
"ambiguous_negative_literals" = "warn"
"elided_lifetimes_in_paths" = "warn"
"absolute_paths_not_starting_with_crate" = "warn"
"single_use_lifetimes" = "warn"
"unreachable_pub" = "warn"
"unused_lifetimes" = "warn"
"unused_qualifications" = "warn"
"keyword_idents" = "warn"
"noop_method_call" = "warn"
"macro_use_extern_crate" = "warn"
"redundant_imports" = "warn"
"redundant_lifetimes" = "warn"
"trivial_numeric_casts" = "warn"
"unused_crate_dependencies" = "warn"
"unused_macro_rules" = "warn"
"unit_bindings" = "warn"

["lints"."clippy"]
"undocumented_unsafe_blocks" = "warn"
