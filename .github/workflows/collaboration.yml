name: Collaboration server
on:
  push:
    paths: ['server/**', 'crates/core/src/collaboration.rs', 'crates/services/src/collaboration/**', 'scripts/qa/collaboration*', '.github/workflows/collaboration.yml']
  pull_request:
    paths: ['server/**', 'crates/core/src/collaboration.rs', 'crates/services/src/collaboration/**', 'scripts/qa/collaboration*', '.github/workflows/collaboration.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
      - run: go build -trimpath -ldflags="-s -w" -o tomato-cloud${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/tomato-cloud
      - uses: actions/upload-artifact@v4
        with:
          name: tomato-cloud-${{ runner.os }}
          path: server/tomato-cloud*
