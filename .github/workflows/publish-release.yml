name: Publish Release
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version matching Cargo.toml, e.g. v1.0.0
        type: string
        required: true
      mode:
        description: Verify packages, create a draft, or publish a release
        type: choice
        options: [publish, draft, verify]
        default: publish
        required: true
permissions: {}
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.source.outputs.run_id }}
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate version and look for existing packages
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Run Publish Release on the default branch ($DEFAULT_BRANCH)." >&2
            exit 1
          fi
          version=${REQUESTED_VERSION#v}
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9.-]+)?$ ]]; then
            echo 'Enter a version such as v1.0.0 or 1.0.0.' >&2
            exit 1
          fi
          source_file() {
            gh api "repos/$GH_REPO/contents/$1?ref=$2" --jq .content | base64 --decode
          }
          workspace_version() {
            source_file Cargo.toml "$1" |
              python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["workspace"]["package"]["version"])'
          }
          current_version=$(workspace_version "$GITHUB_SHA")
          if [[ "$current_version" != "$version" ]]; then
            echo "Cargo.toml version $current_version does not match requested release v$version." >&2
            exit 1
          fi
          locked_version=$(source_file Cargo.lock "$GITHUB_SHA" |
            python3 -c 'import sys, tomllib; print(next((p["version"] for p in tomllib.load(sys.stdin.buffer)["package"] if p["name"] == "tomato" and "source" not in p), ""))')
          if [[ "$locked_version" != "$version" ]]; then
            echo "Cargo.lock Tomato version is ${locked_version:-missing}, expected $version. Run cargo update --workspace and commit Cargo.lock." >&2
            exit 1
          fi
          macos_recipe() {
            gh api "repos/$GH_REPO/contents/scripts/bundle-macos.py?ref=$1" --jq .sha &&
              gh api "repos/$GH_REPO/contents/scripts/verify-macos-renderer.py?ref=$1" --jq .sha
          }
          current_macos_recipe=$(macos_recipe "$GITHUB_SHA")

          runs=$(gh api --method GET "repos/$GH_REPO/actions/runs" \
            -f branch="$DEFAULT_BRANCH" -f event=workflow_dispatch -f status=success -F per_page=100)
          candidates=$(jq -r --arg branch "$DEFAULT_BRANCH" --arg repo "$GH_REPO" '
            .workflow_runs[] | select(.status == "completed" and .conclusion == "success"
              and (.path == ".github/workflows/release.yml" or .path == ".github/workflows/publish-release.yml")
              and .head_branch == $branch and .head_repository.full_name == $repo
              and (.head_sha | test("^[0-9a-f]{40}$"))) | [.id, .head_sha] | @tsv
          ' <<< "$runs")
          run_id=''
          sha=$GITHUB_SHA
          while IFS=$'\t' read -r candidate candidate_sha; do
            [[ -n "$candidate" ]] || continue
            candidate_version=$(workspace_version "$candidate_sha")
            [[ "$candidate_version" == "$version" ]] || continue
            candidate_macos_recipe=$(macos_recipe "$candidate_sha" 2>/dev/null) || continue
            [[ "$candidate_macos_recipe" == "$current_macos_recipe" ]] || continue
            intact=$(gh api "repos/$GH_REPO/actions/runs/$candidate/artifacts?per_page=100" --jq '
              [.artifacts[] | select((.expired | not) and (.name | startswith("tomato-")))] | length')
            [[ "$intact" == 5 ]] || continue
            relation=$(gh api "repos/$GH_REPO/compare/$candidate_sha...$GITHUB_SHA" --jq .status)
            [[ "$relation" == ahead || "$relation" == identical ]] || continue
            run_id=$candidate
            sha=$candidate_sha
            break
          done <<< "$candidates"
          printf 'run_id=%s\nsha=%s\nversion=%s\n' "$run_id" "$sha" "$version" >> "$GITHUB_OUTPUT"
  build:
    needs: source
    if: needs.source.outputs.run_id == ''
    # Release's tag-only publish job declares write access. The matrix itself uses read access.
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
  publish:
    needs: [source, build]
    if: ${{ !cancelled() && needs.source.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ needs.source.outputs.run_id || github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ needs.source.outputs.run_id != '' && github.token || '' }}
          run-id: ${{ needs.source.outputs.run_id || github.run_id }}
          pattern: tomato-*
          path: dist
      - name: Verify all platform packages and prepare release assets
        shell: bash
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          python3 scripts/prepare-release.py dist "$VERSION"
          printf 'Verified %s assets for **v%s** from [Release build %s](%s/%s/actions/runs/%s).\n' \
            "$(wc -l < dist/SHA256SUMS.txt)" "$VERSION" "$BUILD_RUN_ID" "$GITHUB_SERVER_URL" "$GH_REPO" "$BUILD_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Create GitHub Release
        if: inputs.mode == 'draft' || inputs.mode == 'publish'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.source.outputs.version }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          MODE: ${{ inputs.mode }}
        run: |
          flags=(--target "$SOURCE_SHA" --notes-file "$RUNNER_TEMP/release-notes.md")
          tag_error="$RUNNER_TEMP/release-tag-error.txt"
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --silent 2>"$tag_error"; then
            tagged_sha=$(gh api "repos/$GH_REPO/commits/refs%2Ftags%2F$RELEASE_TAG" --jq .sha)
            if [[ "$tagged_sha" != "$SOURCE_SHA" ]]; then
              echo "$RELEASE_TAG already points to a different commit." >&2
              exit 1
            fi
            flags+=(--verify-tag)
          elif ! grep -Fq '(HTTP 404)' "$tag_error"; then
            cat "$tag_error" >&2
            exit 1
          fi
          if [[ "$MODE" == draft ]]; then
            flags+=(--draft)
          fi
          bash scripts/generate-release-notes.sh "$RELEASE_TAG" "$SOURCE_SHA" > "$RUNNER_TEMP/release-notes.md"
          url=$(gh release create "$RELEASE_TAG" dist/*.zip dist/*.tar.gz dist/*-setup.exe dist/SHA256SUMS.txt "${flags[@]}")
          printf '[GitHub Release %s (%s)](%s)\n' "$RELEASE_TAG" "$MODE" "$url" >> "$GITHUB_STEP_SUMMARY"
